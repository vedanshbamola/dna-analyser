<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DNA Sequence Analyzer</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f9ff;
    color: #034078;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: auto;
    background: #e1f5fe;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 100, 150, 0.2);
  }
  h1 {
    text-align: center;
    color: #0077b6;
  }
  label, button {
    font-weight: bold;
    display: block;
    margin-bottom: 10px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 8px;
    font-size: 1.1em;
    border: 2px solid #90caf9;
    border-radius: 6px;
    margin-bottom: 20px;
    box-sizing: border-box;
  }
  button {
    background-color: #0077b6;
    color: white;
    border: none;
    padding: 12px 0;
    border-radius: 8px;
    font-size: 1.1em;
    cursor: pointer;
  }
  button:hover {
    background-color: #005f86;
  }
  .result {
    background-color: #caf0f8;
    border-left: 6px solid #0077b6;
    padding: 15px 20px;
    margin-top: 25px;
    border-radius: 8px;
    word-wrap: break-word;
  }
  .error {
    border-left-color: #d90429;
    background-color: #fcd5d5;
    color: #9b2226;
  }
</style>
</head>
<body>
<div class="container">
  <h1>DNA Sequence Analyzer</h1>
  <label for="dnaInput">Enter DNA Sequence (A, T, G, C only):</label>
  <input type="text" id="dnaInput" placeholder="e.g. ATGCTAGC" />
  <button onclick="analyzeDNA()">Analyze</button>
  <div id="output" class="result" style="display:none;"></div>
</div>
<script>
function analyzeDNA() {
  const dna = document.getElementById('dnaInput').value.toUpperCase().trim();
  const validBases = ['A','T','G','C'];
  let outputDiv = document.getElementById('output');
  outputDiv.style.display = 'block';
  if (!dna) {
    outputDiv.className = 'result error';
    outputDiv.innerHTML = 'Please enter a DNA sequence.';
    return;
  }
  // Validate DNA
  for (let base of dna) {
    if (!validBases.includes(base)) {
      outputDiv.className = 'result error';
      outputDiv.innerHTML = `<strong>Invalid DNA sequence.</strong> Only A, T, G, C are allowed.<br>Invalid character found: "${base}"`;
      return;
    }
  }
  // Count bases
  let countA = dna.split('A').length - 1;
  let countT = dna.split('T').length - 1;
  let countG = dna.split('G').length - 1;
  let countC = dna.split('C').length - 1;
  let length = dna.length;
  // GC content percentage
  let gcContent = ((countG + countC) / length) * 100;
  // Complement sequence
  let complement = '';
  for (let base of dna) {
    if (base === 'A') complement += 'T';
    else if (base === 'T') complement += 'A';
    else if (base === 'G') complement += 'C';
    else if (base === 'C') complement += 'G';
  }
  // Display results
  outputDiv.className = 'result';
  outputDiv.innerHTML = `
    <p><strong>DNA sequence given is:</strong> ${dna}</p>
    <p><strong>Valid DNA sequence</strong></p>
    <p>Number of A: ${countA}</p>
    <p>Number of T: ${countT}</p>
    <p>Number of G: ${countG}</p>
    <p>Number of C: ${countC}</p>
    <p>Total characters: ${length}</p>
    <p>GC content: ${gcContent.toFixed(2)}%</p>
    <p>Complemented DNA sequence: ${complement}</p>
    <p><em>DNA Analysis Complete !!</em></p>
  `;
}
</script>
</body>
</html>
